# cPanel SSL userdata include for beta-api.autocars.co.za only.
# Install after the beta virtual host and its valid SSL certificate exist.
# Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel and mod_headers.
ProxyPreserveHost On
RequestHeader set X-Forwarded-Proto "https"
ProxyPass "/api/live" "ws://127.0.0.1:4010/api/live"
ProxyPassReverse "/api/live" "ws://127.0.0.1:4010/api/live"
ProxyPass "/" "http://127.0.0.1:4010/"
ProxyPassReverse "/" "http://127.0.0.1:4010/"
