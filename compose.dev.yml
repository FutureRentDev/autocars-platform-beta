# Optional local email inbox. This does not deliver mail to real recipients.
# Start only when testing email: npm run mail:start
services:
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 500
volumes:
  mailpit-data:
